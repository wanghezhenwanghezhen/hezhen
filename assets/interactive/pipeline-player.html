 constructor(root,data){
  this.root=root;this.data=data;this.mode=0;this.route=0;this.index=0;this.playing=false;this.timer=null;this.raf=null;this.elapsed=0;this.started=0;
  this.reduced=matchMedia('(prefers-reduced-motion: reduce)');
  this.tabs=[...root.querySelectorAll('[data-pipe-tab]')];this.panels=[...root.querySelectorAll('[data-pipe-panel]')];
  this.select=root.querySelector('[data-pipe-route]');this.playButton=root.querySelector('[data-pipe-play]');
  this.tabs.forEach((tab,i)=>{tab.onclick=()=>this.setMode(i);tab.onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const j=e.key==='Home'?0:e.key==='End'?this.tabs.length-1:(i+(e.key==='ArrowRight'?1:this.tabs.length-1))%this.tabs.length;this.setMode(j);this.tabs[j].focus();}};});
  this.select.onchange=()=>{this.pause();this.route=Number(this.select.value);this.reset();};
  this.playButton.onclick=()=>this.playing?this.pause():this.play();
  root.querySelector('[data-pipe-step]').onclick=()=>{this.pause();this.index=Math.min(this.nodes().length-1,this.index+1);this.elapsed=0;this.paint();};
  root.querySelector('[data-pipe-reset]').onclick=()=>this.reset();
  root.querySelectorAll('[data-pipe-node]').forEach(el=>{
   const inspect=()=>{this.pause();const id=el.dataset.pipeNode;const found=this.graph().nodes.find(n=>n.id===id);this.paint(id);this.describe(found.title,found.detail);};
   el.onclick=inspect;el.onkeydown=e=>{if(['Enter',' '].includes(e.key)){e.preventDefault();inspect();}};
  });
  root.addEventListener('keydown',e=>e.stopPropagation());
  document.addEventListener('visibilitychange',()=>{if(document.hidden)this.pause();});
  this.reduced.addEventListener('change',()=>{this.pause();this.elapsed=0;this.paint();});
  this.observer=new MutationObserver(()=>{if(!root.closest('.slide').classList.contains('active'))this.pause();});
  this.observer.observe(root.closest('.slide'),{attributes:true,attributeFilter:['class']});
  this.setMode(0);

 graph(){return this.data[this.mode];}
 nodes(){return this.graph().routes[this.route].nodes;}
 panel(){return this.panels[this.mode];}
 describe(title,text){this.root.querySelector('[data-pipe-heading]').textContent=title;this.root.querySelector('[data-pipe-detail]').textContent=text;}
 setMode(index){
  this.pause();this.mode=index;this.route=0;
  this.tabs.forEach((b,i)=>{b.setAttribute('aria-selected',String(i===index));b.tabIndex=i===index?0:-1;});
  this.panels.forEach((p,i)=>{p.hidden=i!==index;p.toggleAttribute('inert',i!==index);});
  this.select.replaceChildren(...this.graph().routes.map((r,i)=>{const o=document.createElement('option');o.value=i;o.textContent=r.title;return o;}));this.select.value='0';
  this.root.querySelector('[data-pipe-source]').href=this.graph().url;this.reset();
 }
 paint(selected){
  const sequence=this.nodes(),id=selected||sequence[this.index];
  this.panel().querySelectorAll('[data-pipe-node]').forEach(n=>{n.classList.toggle('is-current',n.dataset.pipeNode===id);n.setAttribute('aria-pressed',String(n.dataset.pipeNode===id));});
  const previous=this.index>0?sequence[this.index-1]+'-'+sequence[this.index]:'';
  this.panel().querySelectorAll('[data-pipe-edge]').forEach(e=>e.classList.toggle('is-current',!selected&&e.dataset.pipeEdge===previous));
  const n=this.graph().nodes.find(n=>n.id===id),edge=this.graph().edges.find(e=>e.id===previous);
  this.describe(n.title,(edge&&!selected?edge.label+' → ':'')+n.detail);
  this.root.querySelector('[data-pipe-progress]').textContent=`${String(this.index+1).padStart(2,'0')} / ${String(sequence.length).padStart(2,'0')}`;
  this.root.querySelector('[data-pipe-step]').disabled=this.index>=sequence.length-1;
  this.root.dataset.pipeMode=this.graph().id;this.root.dataset.pipeIndex=String(this.index);
  this.panel().querySelector('.pipe-signal').style.opacity='0';
 }
 reset(){this.pause();this.index=0;this.elapsed=0;this.paint();}
 pause(){
  if(this.playing)this.elapsed+=performance.now()-this.started;
  this.playing=false;clearTimeout(this.timer);cancelAnimationFrame(this.raf);this.timer=null;this.raf=null;
  if(this.playButton)this.playButton.textContent='▶ 播放';
 }
 play(){
  if(this.playing)return;
  if(this.index>=this.nodes().length-1){this.index=0;this.elapsed=0;this.paint();}
  this.playing=true;this.playButton.textContent='Ⅱ 暂停';this.advance();
 }
 advance(){
  if(!this.playing)return;
  const seq=this.nodes();if(this.index>=seq.length-1){this.pause();this.elapsed=0;this.playButton.textContent='↻ 重播';return;}
  const edgeId=seq[this.index]+'-'+seq[this.index+1],edge=this.graph().edges.find(e=>e.id===edgeId);
  this.panel().querySelectorAll('[data-pipe-edge]').forEach(e=>e.classList.toggle('is-current',e.dataset.pipeEdge===edgeId));
  this.started=performance.now();const duration=1400,travel=900;
  const signal=this.panel().querySelector('.pipe-signal');
  const tick=()=>{
   if(!this.playing)return;const t=this.elapsed+performance.now()-this.started;
   if(!this.reduced.matches&&t<travel){const p=PipelinePlayer.point(edge.points,Math.min(t/travel,1));signal.style.opacity='1';signal.style.transform=`translate(${p[0]}px, ${p[1]}px)`;}else signal.style.opacity='0';
   this.raf=requestAnimationFrame(tick);
  };tick();
  this.timer=setTimeout(()=>{cancelAnimationFrame(this.raf);this.index++;this.elapsed=0;this.paint();this.advance();},Math.max(0,duration-this.elapsed));
 }
 static point(points,t){
  const lengths=points.slice(1).map((p,i)=>Math.hypot(p[0]-points[i][0],p[1]-points[i][1]));
  let distance=lengths.reduce((a,b)=>a+b,0)*t;
  for(let i=0;i<lengths.length;i++){if(distance<=lengths[i]||i===lengths.length-1){const f=lengths[i]?distance/lengths[i]:0;return [points[i][0]+(points[i+1][0]-points[i][0])*f,points[i][1]+(points[i+1][1]-points[i][1])*f];}distance-=lengths[i];}
  return points[0];
 }
}
document.querySelectorAll('[data-pipeline-player]').forEach(root=>new PipelinePlayer(root,JSON.parse(root.querySelector('#pipeline-data').textContent)));
</script></body></html>
