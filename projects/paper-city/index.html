*{box-sizing:border-box}
body{margin:0;overflow:hidden}button,select,input{font:inherit}button,select{color:var(--ink);cursor:pointer}
button{border:1px solid var(--line);border-radius:8px;background:white;padding:.45em .75em;min-height:32px;line-height:1.2}

#map-marker:after{content:"";position:absolute;top:100%;left:50%;margin-left:-4px;border:4px solid transparent;border-top-color:#02153be8}
#pawn-go{position:fixed;z-index:1;transform:translate(-50%,calc(-100% - 5px));display:none;border:1px solid #8e527b;color:#681949;background:#fff8fe;box-shadow:0 2px 4px #313c7a28;border-radius:9px;padding:2px 6px;min-height:0;font:bold 11px/1.3 system-ui,sans-serif}
.ready #pawn-go:not([hidden]){display:block}#pawn-go::after{content:"";position:absolute;left:50%;bottom:-3px;width:4px;height:4px;transform:translateX(-50%) rotate(45deg);border:solid #8e527b;border-width:0 1px 1px 0;background:#fff8fe}
#board-tools{bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);align-items:center;gap:7px;padding:6px 8px;white-space:nowrap}

#city-map{display:block;width:100%;height:min(52vh,540px);object-fit:contain;margin:8px auto;cursor:crosshair}dialog select{max-width:70%;padding:6px;border-radius:6px;border:1px solid var(--line)}
