<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>撕拉票 · SVG / PNG 倾斜预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f2df;color:#343a40;font:16px/1.6 'Microsoft YaHei',sans-serif}header{max-width:1120px;margin:auto;padding:32px 28px 16px}header small{letter-spacing:3px}h1{font-size:clamp(24px,4vw,38px);margin:8px 0}p{margin:6px 0}a{color:inherit}.controls{position:sticky;top:0;z-index:10;background:#f4f2dff2;backdrop-filter:blur(12px);display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:12px 22px;padding:14px 20px;border-bottom:1px solid #343a4020}button{font:inherit;min-height:44px;padding:8px 20px;border:1px solid #343a4050;background:#fffdf0;border-radius:24px;cursor:pointer}button[aria-pressed=true]{background:#343a40;color:white}label{display:flex;align-items:center;gap:9px}input{accent-color:#829c34}button:focus-visible,.stage:focus-visible{outline:3px solid #6666cc;outline-offset:5px}main{max-width:1120px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:32px;padding:24px 28px 48px}.sample{text-align:center;min-width:0}.sample h2{font-size:19px;margin:0}.caption{font-size:13px;color:#59624b;margin-bottom:16px}.stage{height:650px;display:grid;place-items:center;perspective:1300px;position:relative;border-radius:28px;background:radial-gradient(ellipse at 50% 40%,#fffef5,#e4e7c5);touch-action:pan-y}.ticket{width:min(72%,290px);aspect-ratio:778/1454;position:relative;transform-style:preserve-3d;will-change:transform;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}.face{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform:translateZ(2px);backface-visibility:hidden;pointer-events:none}.paper{position:absolute;inset:0;background:#ddd8b7;mask:var(--ticket) center/100% 100% no-repeat;-webkit-mask:var(--ticket) center/100% 100% no-repeat;transform:translateZ(var(--z));pointer-events:none}.back{background:#f7f3e6;transform:translateZ(-2px) rotateY(180deg)}.shadow{position:absolute;inset:0;transform:translate3d(12px,16px,-12px);filter:blur(12px);opacity:.23;background:#3c4725;mask:var(--ticket) center/100% 100% no-repeat;-webkit-mask:var(--ticket) center/100% 100% no-repeat;pointer-events:none}.zone{position:absolute;left:4.9%;top:5.15%;width:90.2%;height:61.35%;background:#5dbaf34d;border:2px dashed #258fd4;transform:translateZ(3px);display:none;pointer-events:none}.show-zone .zone{display:grid;place-items:center}.zone span{background:#f8f9fae8;padding:5px 8px;border-radius:6px;font-size:12px}.loading{position:absolute;bottom:12px;font-size:12px;color:#59624b}.note{max-width:1064px;margin:0 auto 32px;padding:0 24px;font-size:13px}.angle{min-width:70px;font-variant-numeric:tabular-nums}footer{padding:0 28px 35px;text-align:center;font-size:13px}
@media(max-width:767px){main{grid-template-columns:1fr;padding:20px 16px;gap:28px}.stage{height:min(670px,155vw)}header{padding:24px 20px 12px}.controls{gap:8px 14px;font-size:13px}.ticket{width:min(72%,290px)}}
@media(prefers-reduced-motion:reduce){.ticket{will-change:auto}}
.art-window{position:absolute;left:4.9%;top:5.15%;width:90.2%;height:61.35%;overflow:hidden;transform:translateZ(2.2px);backface-visibility:hidden;pointer-events:none}.art-window img{position:absolute;height:100%;width:auto;max-width:none;left:50%;top:0;transform:translateX(-50%);display:block}
</style>
<header><small>THE QYDL WORLD / TICKET STUDY</small><h1>同一张撕拉票，两种来源。</h1><p>鼠标移到票面上查看倾斜；手机可拖动下方角度滑杆。</p></header>
<div class="controls"><button id="auto" aria-pressed="false">自动倾斜</button><button id="reset">正面复位</button><label>左右倾斜 <input id="angle" aria-label="左右倾斜角度" type="range" min="-35" max="35" value="0"><output class="angle">0°</output></label><label><input id="zone" type="checkbox">显示图片范围</label></div>
<main>
<section class="sample"><h2>A / SVG 票面 · 图片裁切</h2><p class="caption">图片等高缩放 · 居中裁切左右</p><div class="stage" tabindex="0" aria-label="SVG票面，方向键调整倾斜"><div class="ticket" style="--ticket:url('ticket-original.svg')"><div class="shadow"></div><div class="paper back"></div><div class="paper" style="--z:-1px"></div><div class="paper" style="--z:0px"></div><div class="paper" style="--z:1px"></div><img class="face" src="ticket-original.svg" alt="原始绿色条纹撕拉票"><div class="art-window"><img src="ticket-dog.png" alt="长肢小狗，按图片窗口高度居中裁切"></div><div class="zone"><span>后续图片范围</span></div></div><span class="loading">加载票面…</span></div></section>
<section class="sample"><h2>B / 新 PNG · 双主角</h2><p class="caption">本轮替换 · 完整票面原比例</p><div class="stage" tabindex="0" aria-label="PNG票面，方向键调整倾斜"><div class="ticket" style="--ticket:url('ticket-characters.png')"><div class="shadow"></div><div class="paper back"></div><div class="paper" style="--z:-1px"></div><div class="paper" style="--z:0px"></div><div class="paper" style="--z:1px"></div><img class="face" src="ticket-characters.png" alt="粉发女孩与蓝发男孩撕拉票"><div class="zone"><span>后续图片范围</span></div></div><span class="loading">加载票面…</span></div></section>
</main><p class="note">两版使用相同的透视、倾斜角度和薄纸侧边。左侧小狗按蓝框窗口高度等比缩放，左右超出部分由窗口裁切；右侧保留双主角完整票面。</p><footer><a href="/">返回答辩网页</a> · 此页用于确认撕拉票效果</footer>
<script>
const tickets=[...document.querySelectorAll('.ticket')],stages=[...document.querySelectorAll('.stage')],auto=document.querySelector('#auto'),slider=document.querySelector('#angle'),output=document.querySelector('output'),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let targetX=0,targetY=0,x=0,y=0,automatic=false,frame=0,started=0,last=0;
function paint(){for(const t of tickets){t.style.setProperty('--rx',x+'deg');t.style.setProperty('--ry',y+'deg')}}
function stopAuto(){automatic=false;auto.setAttribute('aria-pressed','false')}
function tick(now){frame=0;if(document.hidden)return;const dt=Math.min(50,now-(last||now));last=now;if(automatic){targetX=Math.sin((now-started)/1700)*9;targetY=Math.sin((now-started)/2200)*24}const k=reduced?1:1-Math.exp(-dt/85);x+=(targetX-x)*k;y+=(targetY-y)*k;paint();if(automatic||Math.abs(targetX-x)+Math.abs(targetY-y)>.015)frame=requestAnimationFrame(tick)}
function wake(){if(!frame){last=0;frame=requestAnimationFrame(tick)}}
auto.onclick=()=>{automatic=!automatic;auto.setAttribute('aria-pressed',String(automatic));started=performance.now();wake()};
document.querySelector('#reset').onclick=()=>{stopAuto();targetX=targetY=0;slider.value=0;output.textContent='0°';wake()};
slider.oninput=()=>{stopAuto();targetX=0;targetY=Number(slider.value);output.textContent=slider.value+'°';wake()};
document.querySelector('#zone').onchange=e=>document.body.classList.toggle('show-zone',e.target.checked);
for(const stage of stages){stage.addEventListener('pointermove',e=>{if(e.pointerType==='touch'||reduced)return;stopAuto();const r=stage.getBoundingClientRect();targetY=Math.max(-30,Math.min(30,(e.clientX-r.left-r.width/2)/r.width*60));targetX=Math.max(-14,Math.min(14,-(e.clientY-r.top-r.height/2)/r.height*28));wake()});stage.addEventListener('pointerleave',()=>{if(!automatic){targetX=targetY=0;wake()}});stage.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home'].includes(e.key))return;e.preventDefault();stopAuto();if(e.key==='Home')targetX=targetY=0;else if(e.key==='ArrowLeft')targetY=Math.max(-35,targetY-5);else if(e.key==='ArrowRight')targetY=Math.min(35,targetY+5);else if(e.key==='ArrowUp')targetX=Math.max(-20,targetX-5);else targetX=Math.min(20,targetX+5);wake()});const img=stage.querySelector('img'),state=stage.querySelector('.loading');const loaded=()=>{state.textContent='';stage.dataset.loaded='true'};img.onload=loaded;img.onerror=()=>state.textContent='票面加载失败，请刷新或检查文件';if(img.complete&&img.naturalWidth)loaded()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)wake()});
if(!reduced){automatic=true;auto.setAttribute('aria-pressed','true');started=performance.now();wake()}
</script></html>
